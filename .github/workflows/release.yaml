name: Kine build

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      kine_version:
        type: string
        description: Kine version tag for the image
        default: 0.13.5
        required: true

jobs:
  buildx:
    name: Build kine image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch tags
        run: git fetch --tags
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine version
        id: determine_version
        run: echo "VERSION=${{ github.event.inputs.kine_version || github.ref_name }}" | sed 's/v//' >> $GITHUB_ENV
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          tags: ghcr.io/loft-sh/kine:v${{ env.VERSION }}
      - name: Attest
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        id: attest
        with:
          subject-name: ghcr.io/loft-sh/kine
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
