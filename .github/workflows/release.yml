name: Release

# The only workflow that publishes a fork release. Push a vX.Y.Z.vcluster.N
# tag: the job builds and attests the binaries and images, uploads the
# binaries to a draft release, and publishes the release last. Do not create
# the release in the UI first; a published release fails the run, because its
# assets must not change after publication.
on:
  push:
    tags:
      - 'v*.vcluster.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      ARCH: amd64
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write # Needed to create the draft release and upload binary assets
      packages: write # Needed for GHCR image push
      id-token: write # Needed for the attestation signing certificate
      attestations: write # Needed for attest action and attestation upload to GHCR
    steps:
      - name: Validate release tag name
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.vcluster\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' does not match the vX.Y.Z.vcluster.N scheme"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build binaries
        run: make multi-arch-build

      - name: Build binaries (nocgo)
        run: make multi-arch-build CGO_ENABLED=0

      - name: Compute checksum for each binary
        run: |
          arch=("amd64" "arm64" "arm" "riscv64")
          cd dist/artifacts
          for a in "${arch[@]}"; do
            sha256sum kine-"${a}" > sha256sum-"${a}".txt
            sha256sum kine-"${a}-nocgo" > sha256sum-"${a}-nocgo".txt
          done

      - name: Attest binaries
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: dist/artifacts/kine-*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != "true" ]]; then
              echo "::error::Release $TAG was published before this run; fork releases start from a tag push only. No assets means it was created in the UI: delete it, keep the tag, and re-run this workflow. With assets it is already released: cut a new tag."
              exit 1
            fi
            echo "Reusing draft release $TAG"
            exit 0
          fi
          # Changelog from the previous fork release on this line, as the UI did.
          n="${TAG##*.vcluster.}"
          prev="${TAG%.*}.$((n - 1))"
          start=()
          if (( n > 0 )) && gh api "repos/$GH_REPO/git/ref/tags/$prev" >/dev/null 2>&1; then
            start=(--notes-start-tag "$prev")
          fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes "${start[@]}"

      - name: Upload binaries to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/artifacts/kine-* dist/artifacts/*.txt --clobber

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        id: build
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          context: .
          target: multi-arch-package
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kine:latest
            ghcr.io/${{ github.repository_owner }}/kine:${{ github.ref_name }}

      - name: Attest images
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        id: attest
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/kine
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Build and push (nocgo)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        id: build-nocgo
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          context: .
          target: multi-arch-package
          push: true
          build-args: |
            CGO_ENABLED=0
            NOCGO=-nocgo
          tags: |
            ghcr.io/${{ github.repository_owner }}/kine:latest-nocgo
            ghcr.io/${{ github.repository_owner }}/kine:${{ github.ref_name }}-nocgo

      - name: Attest images (nocgo)
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        id: attest-nocgo
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/kine
          subject-digest: ${{ steps.build-nocgo.outputs.digest }}
          push-to-registry: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
