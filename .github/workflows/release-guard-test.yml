name: Release guard tests
on:
  pull_request:
  push:
    branches: [master, 'release/vcluster/v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: python3 -m pip install pytest==8.3.5 PyYAML==6.0.2
      - name: Test release guard contract
        run: python3 -m pytest -q .github/tests/test_release_guard.py
